<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>가계부</title>
  <meta name="theme-color" content="#0f0e17"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="가계부"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f0e17'/%3E%3Ctext y='.9em' font-size='72' x='12'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-is/18.2.0/umd/react-is.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f0e17; }
    body { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
    #root { height: 100%; }
    input { font-family: 'Noto Sans KR', sans-serif; }
    input::placeholder { color: #7c7a9e; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const e = React.createElement;
const { useState, useMemo, useEffect } = React;
const RC = window.Recharts;
if (!RC) {
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;color:#e2e0ef;font-family:sans-serif;text-align:center">' +
    '<p style="font-size:16px;margin-bottom:8px">차트 라이브러리를 불러오지 못했습니다.</p>' +
    '<p style="font-size:13px;color:#7c7a9e">인터넷 연결을 확인한 뒤 새로고침해 주세요.</p></div>';
  throw new Error("Recharts failed to load");
}

const STORAGE_KEY = "gageboo-v1";
function loadRec() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"); } catch { return {}; } }
function saveRec(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }

const MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const DAYS   = ["일","월","화","수","목","금","토"];
const fmt = n => n.toLocaleString("ko-KR")+"원";
const fmtS = n => { const a=Math.abs(n); if(a>=1e8) return (n/1e8).toFixed(1)+"억"; if(a>=1e4) return Math.round(n/1e4)+"만"; return n.toLocaleString(); };
const dim = (y,m) => new Date(y,m+1,0).getDate();
const fd  = (y,m) => new Date(y,m,1).getDay();

const ECAT = [
  {id:"food",l:"식비",i:"🍚"},{id:"transport",l:"교통",i:"🚌"},{id:"shopping",l:"쇼핑",i:"🛍️"},
  {id:"health",l:"건강",i:"💊"},{id:"housing",l:"주거",i:"🏠"},{id:"comm",l:"통신",i:"📱"},
  {id:"culture",l:"문화",i:"🎭"},{id:"etc",l:"기타",i:"💡"}
];
const ICAT = [
  {id:"salary",l:"급여",i:"💼"},{id:"bonus",l:"보너스",i:"🎁"},{id:"invest",l:"투자",i:"📈"},
  {id:"side",l:"부업",i:"🔧"},{id:"etc",l:"기타",i:"💰"}
];

const C = {
  bg:"#0f0e17",surf:"#1a1828",card:"#221f35",bdr:"#2e2a45",
  acc:"#a78bfa",inc:"#34d399",exp:"#f87171",
  txt:"#e2e0ef",mut:"#7c7a9e",wh:"#ffffff"
};

const s = (obj) => obj; // style passthrough

function App() {
  const now = new Date();
  const [view, setView]   = useState("calendar");
  const [year, setYear]   = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const [recs, setRecs]   = useState(loadRec);
  const [selDay, setSel]  = useState(null);
  const [modal, setModal] = useState(false);
  const [showAdd, setAdd] = useState(false);
  const [aType, setAType] = useState("expense");
  const [aAmt,  setAAmt]  = useState("");
  const [aCat,  setACat]  = useState("");
  const [aMemo, setAMemo] = useState("");

  const mk = `${year}-${String(month+1).padStart(2,"0")}`;
  const mr = useMemo(()=>recs[mk]||{},[recs,mk]);

  const sum = useMemo(()=>{
    let inc=0,exp=0;
    Object.values(mr).forEach(a=>a.forEach(r=>r.type==="income"?inc+=r.amount:exp+=r.amount));
    return {inc,exp,bal:inc-exp};
  },[mr]);

  const totalD = dim(year,month);
  const startD = fd(year,month);
  const cells = [];
  for(let i=0;i<startD;i++) cells.push(null);
  for(let d=1;d<=totalD;d++) cells.push(d);

  function daySum(d) {
    const a=mr[String(d)]||[]; let inc=0,exp=0;
    a.forEach(r=>r.type==="income"?inc+=r.amount:exp+=r.amount);
    return {inc,exp};
  }

  function prevM() { if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); }
  function nextM() { if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); }

  function doSave() {
    const amt=parseInt(aAmt.replace(/[^0-9]/g,""),10);
    if(!amt||amt<=0) return;
    const cat=aCat||"etc";
    const rec={type:aType,amount:amt,category:cat,memo:aMemo,ts:Date.now()};
    const k=String(selDay);
    const upd={...recs,[mk]:{...mr,[k]:[...(mr[k]||[]),rec]}};
    setRecs(upd); saveRec(upd);
    setAAmt(""); setAMemo(""); setACat(""); setAdd(false);
  }

  function doDel(dk,idx) {
    const a=[...(mr[dk]||[])]; a.splice(idx,1);
    const upd={...recs,[mk]:{...mr,[dk]:a}};
    setRecs(upd); saveRec(upd);
  }

  function onAmt(ev) {
    const raw=ev.target.value.replace(/[^0-9]/g,"");
    setAAmt(raw?parseInt(raw,10).toLocaleString():"");
  }

  const analytics = useMemo(()=>{
    const data=[];
    for(let i=5;i>=0;i--){
      let m=month-i, y=year;
      if(m<0){m+=12;y-=1;}
      const key=`${y}-${String(m+1).padStart(2,"0")}`;
      const mrd=recs[key]||{}; let inc=0,exp=0;
      Object.values(mrd).forEach(a=>a.forEach(r=>r.type==="income"?inc+=r.amount:exp+=r.amount));
      data.push({label:`${m+1}월`,income:inc,expense:exp,balance:inc-exp});
    }
    return data;
  },[recs,year,month]);

  const cats = aType==="expense"?ECAT:ICAT;

  // ── helpers ──
  const btn = (text, onClick, extra={}) =>
    e("button",{onClick, style:{fontFamily:"'Noto Sans KR',sans-serif",...extra}},text);

  const summaryCards = (items) =>
    e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,padding:"16px 20px"}},
      ...items.map(s=>
        e("div",{key:s.l,style:{background:C.card,borderRadius:14,padding:"12px 10px",textAlign:"center",border:`1px solid ${C.bdr}`}},
          e("div",{style:{fontSize:11,color:C.mut,marginBottom:4}},s.l),
          e("div",{style:{fontSize:13,fontWeight:700,color:s.c}},fmtS(s.v))
        )
      )
    );

  // ── CALENDAR ──
  const calendarView = e("div",null,
    // month nav
    e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",margin:"18px 20px 0"}},
      btn("‹",prevM,{background:"transparent",border:`1px solid ${C.bdr}`,color:C.txt,borderRadius:10,width:36,height:36,fontSize:20,cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center"}),
      e("span",{style:{fontSize:18,fontWeight:700,color:C.wh}},`${year}년 ${MONTHS[month]}`),
      btn("›",nextM,{background:"transparent",border:`1px solid ${C.bdr}`,color:C.txt,borderRadius:10,width:36,height:36,fontSize:20,cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center"})
    ),
    // summary
    summaryCards([{l:"수입",v:sum.inc,c:C.inc},{l:"지출",v:sum.exp,c:C.exp},{l:"잔액",v:sum.bal,c:C.acc}]),
    // weekday headers
    e("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",padding:"0 14px",marginBottom:6}},
      ...DAYS.map((d,i)=>e("div",{key:d,style:{textAlign:"center",fontSize:11,fontWeight:600,paddingBottom:4,color:i===0?"#f87171":i===6?"#60a5fa":C.mut}},d))
    ),
    // grid
    e("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,padding:"0 14px 120px"}},
      ...cells.map((d,i)=>{
        if(!d) return e("div",{key:"e"+i});
        const {inc,exp}=daySum(d);
        const isT=d===now.getDate()&&month===now.getMonth()&&year===now.getFullYear();
        const dow=(startD+d-1)%7;
        return e("div",{
          key:d,
          onClick:()=>{setSel(d);setModal(true);setAdd(false);},
          style:{background:isT?C.acc+"22":C.card,border:isT?`1.5px solid ${C.acc}`:`1px solid ${C.bdr}`,
            borderRadius:12,padding:"8px 4px 6px",cursor:"pointer",minHeight:68,
            display:"flex",flexDirection:"column",alignItems:"center"}
        },
          e("span",{style:{fontSize:13,fontWeight:700,color:dow===0?"#f87171":dow===6?"#60a5fa":C.txt}},d),
          inc>0&&e("span",{style:{fontSize:9,color:C.inc,marginTop:2,fontWeight:600}},"+"+fmtS(inc)),
          exp>0&&e("span",{style:{fontSize:9,color:C.exp,marginTop:1,fontWeight:600}},"-"+fmtS(exp))
        );
      })
    )
  );

  // ── ANALYTICS ──
  const analyticsView = e("div",{style:{padding:"16px 16px 120px"}},
    e("div",{style:{marginTop:18,marginBottom:16}},
      e("span",{style:{fontSize:18,fontWeight:700,color:C.wh}},"최근 6개월 추이")
    ),
    summaryCards([{l:"이번달 수입",v:sum.inc,c:C.inc},{l:"이번달 지출",v:sum.exp,c:C.exp},{l:"이번달 잔액",v:sum.bal,c:C.acc}]),
    // income/expense chart
    e("div",{style:{background:C.card,borderRadius:16,padding:"16px 8px",border:`1px solid ${C.bdr}`,marginBottom:16}},
      e("div",{style:{fontSize:13,fontWeight:700,color:C.wh,paddingLeft:12,marginBottom:12}},"수입 / 지출 추이"),
      e(RC.ResponsiveContainer,{width:"100%",height:200},
        e(RC.LineChart,{data:analytics,margin:{top:5,right:16,left:0,bottom:5}},
          e(RC.CartesianGrid,{strokeDasharray:"3 3",stroke:C.bdr}),
          e(RC.XAxis,{dataKey:"label",tick:{fill:C.mut,fontSize:11},axisLine:false,tickLine:false}),
          e(RC.YAxis,{tickFormatter:fmtS,tick:{fill:C.mut,fontSize:10},axisLine:false,tickLine:false,width:46}),
          e(RC.Tooltip,{contentStyle:{background:C.surf,border:`1px solid ${C.bdr}`,borderRadius:10,fontSize:12},
            labelStyle:{color:C.wh,fontWeight:700},
            formatter:(v,n)=>[fmt(v),n==="income"?"수입":"지출"]}),
          e(RC.Legend,{formatter:v=>v==="income"?"수입":"지출",wrapperStyle:{fontSize:12,color:C.mut}}),
          e(RC.Line,{type:"monotone",dataKey:"income",stroke:C.inc,strokeWidth:2,dot:{r:4,fill:C.inc},name:"income"}),
          e(RC.Line,{type:"monotone",dataKey:"expense",stroke:C.exp,strokeWidth:2,dot:{r:4,fill:C.exp},name:"expense"})
        )
      )
    ),
    // balance chart
    e("div",{style:{background:C.card,borderRadius:16,padding:"16px 8px",border:`1px solid ${C.bdr}`}},
      e("div",{style:{fontSize:13,fontWeight:700,color:C.wh,paddingLeft:12,marginBottom:12}},"잔액 추이"),
      e(RC.ResponsiveContainer,{width:"100%",height:200},
        e(RC.LineChart,{data:analytics,margin:{top:5,right:16,left:0,bottom:5}},
          e(RC.CartesianGrid,{strokeDasharray:"3 3",stroke:C.bdr}),
          e(RC.XAxis,{dataKey:"label",tick:{fill:C.mut,fontSize:11},axisLine:false,tickLine:false}),
          e(RC.YAxis,{tickFormatter:fmtS,tick:{fill:C.mut,fontSize:10},axisLine:false,tickLine:false,width:46}),
          e(RC.Tooltip,{contentStyle:{background:C.surf,border:`1px solid ${C.bdr}`,borderRadius:10,fontSize:12},
            labelStyle:{color:C.wh,fontWeight:700},formatter:v=>[fmt(v),"잔액"]}),
          e(RC.Line,{type:"monotone",dataKey:"balance",stroke:C.acc,strokeWidth:2.5,name:"balance",
            dot:(props)=>{ const {cx,cy,value,key}=props; return React.createElement("circle",{key,cx,cy,r:4,fill:value<0?C.exp:C.acc,stroke:"none"}); }
          })
        )
      )
    )
  );

  // ── MODAL ──
  const dayRecs = mr[String(selDay)]||[];
  const modalEl = (modal && selDay) && e("div",{
    style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:100},
    onClick:ev=>{ if(ev.target===ev.currentTarget){setModal(false);setAdd(false);} }
  },
    e("div",{style:{background:C.surf,width:"100%",maxWidth:480,borderRadius:"24px 24px 0 0",
      paddingBottom:40,maxHeight:"80vh",overflowY:"auto",border:`1px solid ${C.bdr}`,borderBottom:"none"}},
      // handle
      e("div",{style:{display:"flex",justifyContent:"center",padding:"12px 0 4px"}},
        e("div",{style:{width:40,height:4,borderRadius:2,background:C.bdr}})
      ),
      // title row
      e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 20px 14px"}},
        e("span",{style:{fontSize:17,fontWeight:700,color:C.wh}},`${year}년 ${month+1}월 ${selDay}일`),
        btn("+ 추가",()=>{setAdd(true);setAType("expense");setACat("");setAAmt("");setAMemo("");},{
          background:C.acc,color:C.bg,border:"none",borderRadius:20,padding:"7px 16px",fontSize:13,fontWeight:700,cursor:"pointer"
        })
      ),
      // empty
      dayRecs.length===0&&!showAdd&&e("div",{style:{textAlign:"center",padding:"24px 0",color:C.mut,fontSize:13}},"기록이 없습니다"),
      // records
      e("div",{style:{padding:"0 16px"}},
        ...dayRecs.map((r,idx)=>{
          const cl=r.type==="income"?ICAT:ECAT;
          const cat=cl.find(c=>c.id===r.category)||cl[cl.length-1];
          return e("div",{key:idx,style:{display:"flex",alignItems:"center",justifyContent:"space-between",
            background:C.card,borderRadius:12,padding:"12px 14px",marginBottom:8,border:`1px solid ${C.bdr}`}},
            e("div",{style:{display:"flex",alignItems:"center",gap:10}},
              e("span",{style:{fontSize:20}},cat.i),
              e("div",null,
                e("div",{style:{fontSize:12,color:C.mut}},cat.l),
                r.memo&&e("div",{style:{fontSize:11,color:C.mut,marginTop:1}},r.memo)
              )
            ),
            e("div",{style:{display:"flex",alignItems:"center",gap:10}},
              e("span",{style:{fontSize:14,fontWeight:700,color:r.type==="income"?C.inc:C.exp}},
                (r.type==="income"?"+":"-")+fmt(r.amount)
              ),
              btn("×",()=>doDel(String(selDay),idx),{
                background:"transparent",border:"none",color:C.mut,cursor:"pointer",fontSize:20,lineHeight:1
              })
            )
          );
        })
      ),
      // add form
      showAdd&&e("div",{style:{padding:"12px 16px 0"}},
        e("div",{style:{background:C.card,borderRadius:16,padding:16,border:`1px solid ${C.bdr}`}},
          // type toggle
          e("div",{style:{display:"flex",gap:8,marginBottom:14}},
            ...[{v:"expense",l:"지출",c:C.exp},{v:"income",l:"수입",c:C.inc}].map(t=>
              btn(t.l,()=>{setAType(t.v);setACat("");},{
                flex:1,padding:"9px 0",borderRadius:10,border:"none",cursor:"pointer",fontWeight:700,fontSize:14,
                background:aType===t.v?t.c+"22":C.surf,color:aType===t.v?t.c:C.mut,
                outline:aType===t.v?`1.5px solid ${t.c}`:"1.5px solid transparent",width:"100%"
              })
            )
          ),
          // categories
          e("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}},
            ...cats.map(c=>
              btn(c.i+" "+c.l,()=>setACat(c.id),{
                padding:"5px 10px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,
                background:aCat===c.id?C.acc+"33":C.surf,color:aCat===c.id?C.acc:C.mut,
                outline:aCat===c.id?`1.5px solid ${C.acc}`:"1.5px solid transparent"
              })
            )
          ),
          // amount
          e("input",{type:"text",inputMode:"numeric",placeholder:"금액 입력",value:aAmt,onChange:onAmt,
            style:{width:"100%",background:C.surf,border:`1px solid ${C.bdr}`,borderRadius:10,
              padding:"10px 14px",color:C.wh,fontSize:16,fontWeight:700,outline:"none",
              marginBottom:10,display:"block"}}),
          // memo
          e("input",{type:"text",placeholder:"메모 (선택)",value:aMemo,onChange:ev=>setAMemo(ev.target.value),
            style:{width:"100%",background:C.surf,border:`1px solid ${C.bdr}`,borderRadius:10,
              padding:"9px 14px",color:C.txt,fontSize:13,outline:"none",marginBottom:12,display:"block"}}),
          // buttons
          e("div",{style:{display:"flex",gap:8}},
            btn("취소",()=>setAdd(false),{flex:1,padding:"10px 0",borderRadius:10,border:`1px solid ${C.bdr}`,
              background:"transparent",color:C.mut,fontWeight:600,cursor:"pointer",fontSize:13}),
            btn("저장",doSave,{flex:2,padding:"10px 0",borderRadius:10,border:"none",
              background:C.acc,color:C.bg,fontWeight:700,cursor:"pointer",fontSize:14})
          )
        )
      )
    )
  );

  // ── ROOT ──
  return e("div",{style:{fontFamily:"'Noto Sans KR',sans-serif",background:C.bg,minHeight:"100dvh",color:C.txt,maxWidth:480,margin:"0 auto",position:"relative"}},
    // header
    e("div",{style:{padding:"20px 20px 0"}},
      e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",paddingTop:4}},
        e("span",{style:{fontSize:22,fontWeight:700,letterSpacing:-0.5,color:C.wh}},"📒 가계부"),
        e("div",{style:{display:"flex",gap:8}},
          ...[["calendar","📅 캘린더"],["analytics","📊 분석"]].map(([v,label])=>
            btn(label,()=>setView(v),{
              padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,
              background:view===v?C.acc:C.card,color:view===v?C.bg:C.mut
            })
          )
        )
      )
    ),
    view==="calendar"?calendarView:analyticsView,
    modalEl
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
