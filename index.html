function canonical(v) {
  if (Array.isArray(v)) return '[' + v.map(canonical).join(',') + ']';
  if (v && typeof v === 'object') {
    return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canonical(v[k])).join(',') + '}';
  }
  return JSON.stringify(v);
}

function mergeData(a, b) {
  if (Array.isArray(a) && Array.isArray(b)) {
    const seen = new Set(), out = [];
    for (const it of a.concat(b)) {
      const k = canonical(it);
      if (!seen.has(k)) { seen.add(k); out.push(it); }
    }
    return out;
  }
  if (a && b && typeof a === 'object' && typeof b === 'object') {
    if (a.__type === 'categories' && b.__type === 'categories') {
      return (b.updatedAt || 0) >= (a.updatedAt || 0) ? b : a;
    }
    const out = Object.assign({}, a);
    for (const k of Object.keys(b)) out[k] = (k in out) ? mergeData(out[k], b[k]) : b[k];
    return out;
  }
  return (b === undefined || b === null) ? a : b;
}

function dedupeAll(d) {
  if (Array.isArray(d)) {
    const seen = new Set(), out = [];
    for (const it of d) {
      const k = canonical(it);
      if (!seen.has(k)) { seen.add(k); out.push(dedupeAll(it)); }
    }
    return out;
  }
  if (d && typeof d === 'object') {
    if (d.__type === 'categories') return d;
    const out = {};
    for (const k of Object.keys(d)) out[k] = dedupeAll(d[k]);
    return out;
  }
  return d;
}

const readLocal = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } };
const writeLocal = d => localStorage.setItem(KEY, JSON.stringify(d));

let currentUser = null;
let isBusy = false;
let syncListeners = [];

function notifySync(status, user = currentUser) {
  syncListeners.forEach(fn => fn({ status, user }));
}

async function doSync() {
  if (!currentUser || isBusy) return false;
  isBusy = true;
  notifySync("동기화 중...");
  try {
    const ref = doc(db, "users", currentUser.uid);
    const snap = await getDoc(ref);
    const remote = snap.exists() ? (snap.data().data || {}) : {};
    const local = readLocal();
    const merged = mergeData(remote, local);

    const changedLocally = canonical(merged) !== canonical(local);
    const changedRemote = canonical(merged) !== canonical(remote);

    if (changedLocally) {
      writeLocal(merged);
      if (window.__onDataUpdated) window.__onDataUpdated(merged);
    }
    if (changedRemote) {
      await setDoc(ref, { data: merged, updatedAt: Date.now() });
    }

    const timeStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    notifySync(`동기화 완료 (${timeStr})`);
    return changedLocally;
  } catch (e) {
    notifySync("동기화 실패: " + e.message);
    return false;
  } finally {
    isBusy = false;
  }
}

async function doPush() {
  if (!currentUser) return;
  try {
    await setDoc(doc(db, "users", currentUser.uid), { data: readLocal(), updatedAt: Date.now() });
    const timeStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    notifySync(`저장됨 (${timeStr})`);
  } catch (e) {
    notifySync("업로드 실패: " + e.message);
  }
}

let pushDebounce = null;
window.__triggerSyncPush = function() {
  clearTimeout(pushDebounce);
  pushDebounce = setTimeout(doPush, 1200);
};

onAuthStateChanged(auth, async u => {
  currentUser = u;
  if (!u) {
    notifySync("오프라인 (기기 로컬 저장)");
  } else {
    notifySync("연결됨: " + u.email);
    await doSync();
  }
});

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && currentUser) {
    await doSync();
  }
});

// Global API bridge for React
window.GagebooFirebase = {
  getAuth: () => auth,
  getCurrentUser: () => currentUser,
  login: async (email, pw) => {
    try {
      await signInWithEmailAndPassword(auth, email, pw);
      return { ok: true };
    } catch (e) {
      if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
        const create = confirm("계정이 없습니다. 이 이메일과 비밀번호로 새로 가입할까요?");
        if (create) {
          try {
            await createUserWithEmailAndPassword(auth, email, pw);
            return { ok: true };
          } catch (e2) {
            return { ok: false, msg: "가입 실패: " + e2.message };
          }
        }
      }
      return { ok: false, msg: "로그인 실패: " + e.message };
    }
  },
  logout: async () => {
    await signOut(auth);
  },
  syncNow: async () => {
    return await doSync();
  },
  subscribeSync: (fn) => {
    syncListeners.push(fn);
    fn({ status: currentUser ? "연결됨" : "오프라인 (기기 로컬 저장)", user: currentUser });
    return () => { syncListeners = syncListeners.filter(l => l !== fn); };
  },
  exportData: () => {
    const raw = localStorage.getItem(KEY) || "{}";
    const blob = new Blob([raw], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date(), p = n => String(n).padStart(2, '0');
    a.href = url;
    a.download = `gageboo-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },
  importData: (file, onSuccess, onError) => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const incoming = JSON.parse(r.result);
        const current = readLocal();
        const merged = dedupeAll(mergeData(current, incoming));
        writeLocal(merged);
        if (window.__onDataUpdated) window.__onDataUpdated(merged);
        window.__triggerSyncPush();
        onSuccess && onSuccess();
      } catch (err) {
        onError && onError(err.message);
      }
    };
    r.readAsText(file);
  },
  dedupeData: () => {
    const cur = readLocal();
    const cleaned = dedupeAll(cur);
    writeLocal(cleaned);
    if (window.__onDataUpdated) window.__onDataUpdated(cleaned);
    window.__triggerSyncPush();
    return true;
  }
};
</script>

  const a = Math.abs(n || 0);

  if (a >= 1e4) return sign + (a / 1e4).toFixed(1) + "만";
  return (n || 0).toLocaleString();

function App() {

  const [month, setMonth] = useState(now.getMonth());

  const [loginPw, setLoginPw] = useState("");
  const [authError, setAuthError] = useState("");

  // PWA Install State
  const [installPrompt, setInstallPrompt] = useState(window.deferredInstallPrompt || null);
  const [isStandalone, setIsStandalone] = useState(false);
  const [showSamsungGuide, setShowSamsungGuide] = useState(false);
  const [showIosGuide, setShowIosGuide] = useState(false);
  const [showInstallBanner, setShowInstallBanner] = useState(true);

  // Transaction form states
  const [aType, setAType] = useState("expense");
  const [aAmt, setAAmt] = useState("");
  const [aCat, setACat] = useState("");
  const [aMemo, setAMemo] = useState("");

  // PWA standalone detection & prompt binding
  useEffect(() => {
    const isStandaloneMode =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true ||
      document.referrer.includes('android-app://');
    setIsStandalone(isStandaloneMode);

    if (window.deferredInstallPrompt) {
      setInstallPrompt(window.deferredInstallPrompt);
    }

    window.__onInstallPromptAvailable = (e) => {
      setInstallPrompt(e);
    };

    window.__onAppInstalled = () => {
      setInstallPrompt(null);
      setIsStandalone(true);
      setShowInstallBanner(false);
    };

    return () => {
      window.__onInstallPromptAvailable = null;
      window.__onAppInstalled = null;
    };
  }, []);

  const handleInstallClick = async () => {
    // 1. If native prompt event was captured
    if (installPrompt) {
      try {
        await installPrompt.prompt();
        const { outcome } = await installPrompt.userChoice;
        if (outcome === 'accepted') {
          setInstallPrompt(null);
          setIsStandalone(true);
          setShowInstallBanner(false);
        }
      } catch (err) {
        console.warn("Install prompt error:", err);
      }
      return;
    }

    // 2. Specific browser guides
    const ua = navigator.userAgent.toLowerCase();
    const isSamsung = ua.includes('samsungbrowser');
    const isIos = /iphone|ipad|ipod/.test(ua);

    if (isSamsung) {
      setShowSamsungGuide(true);
    } else if (isIos) {
      setShowIosGuide(true);
    } else {
      alert("브라우저 상단 주소창의 설치 아이콘 [⬇] 또는 메뉴(⋮)에서 '앱 설치'를 눌러주세요!\n(주의: '홈 화면에 추가'가 아닌 '앱 설치'를 눌러야 주소창 없는 독립 앱으로 설치됩니다.)");
    }
  };

  // Subscribe to Firebase sync changes
  useEffect(() => {
    window.__onDataUpdated = (newData) => {
      setRecs(newData);
    };
    if (window.GagebooFirebase) {
      const unsub = window.GagebooFirebase.subscribeSync(state => {
        setSyncState(state);
      });
      return () => unsub();
    }

  // Extract Categories

  const expenseCats = customCats.expense || DEFAULT_EXPENSE_CATS;

  // Active categories for transaction
  const cats = aType === "expense" ? expenseCats : incomeCats;

    const list = type === "income" ? incomeCats : expenseCats;
    const found = list.find(c => c.id === catId);
    if (found) return found;
    // Check the other list just in case

    const upd = { ...recs, [mk]: { ...mr, [k]: [...(mr[k] || []), rec] } };
    setRecs(upd);
    saveRec(upd);
    setAAmt(""); setAMemo(""); setACat(""); setAdd(false);
  }

  // Delete Transaction
  function doDel(dk, idx) {
    const a = [...(mr[dk] || [])];
    a.splice(idx, 1);
    const upd = { ...recs, [mk]: { ...mr, [dk]: a } };
    setRecs(upd);
    saveRec(upd);
  }

    const raw = ev.target.value.replace(/[^0-9]/g, "");

    const isExp = catMgrTab === "expense";

    if (currentList.some(c => c.l === name)) {
      alert("이미 같은 이름의 카테고리가 존재합니다.");
      return;
    }
    const newId = "cat_" + Date.now().toString(36);
    const newCat = { id: newId, l: name, i: newCatEmoji || "💡" };
    currentList.push(newCat);

    const updatedCategoryObj = {
      __type: "categories",
      updatedAt: Date.now(),
      expense: isExp ? currentList : expenseCats,
      income: isExp ? incomeCats : currentList
    };

    const upd = { ...recs, __categories__: updatedCategoryObj };
    setRecs(upd);
    saveRec(upd);
    setNewCatName("");
  }

  function handleDeleteCategory(catId) {

      return;
    }
    const isExp = catMgrTab === "expense";
    const currentList = isExp ? [...expenseCats] : [...incomeCats];
    const target = currentList.find(c => c.id === catId);
    if (!confirm(`'${target ? target.l : "카테고리"}'를 삭제하시겠습니까?\n(기존에 등록된 내역은 유지됩니다)`)) return;

    const filtered = currentList.filter(c => c.id !== catId);
    const updatedCategoryObj = {
      __type: "categories",
      updatedAt: Date.now(),
      expense: isExp ? filtered : expenseCats,
      income: isExp ? incomeCats : filtered

    setRecs(upd);

    const catMap = {};
    let totalExpense = 0;
    let totalIncome = 0;

    Object.entries(anMonthRecs).forEach(([day, items]) => {
      if (Array.isArray(items)) {
        items.forEach(r => {
          if (r.type === "expense") {
            totalExpense += r.amount;
            if (!catMap[r.category]) {
              catMap[r.category] = { id: r.category, amount: 0, count: 0, items: [] };
            }
            catMap[r.category].amount += r.amount;
            catMap[r.category].count += 1;
            catMap[r.category].items.push({ ...r, day: parseInt(day, 10) });
          } else if (r.type === "income") {
            totalIncome += r.amount;
          }
        });
      }
    });

    const list = Object.values(catMap).map(c => {
      const info = getCatInfo(c.id, "expense");
      const pct = totalExpense > 0 ? (c.amount / totalExpense) * 100 : 0;
      c.items.sort((a, b) => a.day - b.day);
      return {
        id: c.id,
        name: info.l,
        icon: info.i,
        amount: c.amount,
        count: c.count,
        percent: pct,
        items: c.items
      };
    });

    list.sort((a, b) => b.amount - a.amount);

    return {
      totalExpense,
      totalIncome,
      balance: totalIncome - totalExpense,
      categories: list

            btn("취소", () => setAdd(false), { flex: 1, padding: "10px 0", borderRadius: 10, border: `1px solid ${C.bdr}`, background: "transparent", color: C.mut, fontWeight: 600, cursor: "pointer", fontSize: 13 }),
            btn("저장", doSave, { flex: 2, padding: "10px 0", borderRadius: 10, border: "none", background: C.acc, color: C.bg, fontWeight: 700, cursor: "pointer", fontSize: 14 })
          )
        )
      )
    )
  );

  // ── ROOT RENDER ──
  return e("div", {
    style: { fontFamily: "'Noto Sans KR', sans-serif", background: C.bg, minHeight: "100dvh", color: C.txt, maxWidth: 480, margin: "0 auto", position: "relative" }
  },
    // Top App Header
    e("div", { style: { padding: "14px 18px 4px" } },
      e("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between" } },
        e("span", { style: { fontSize: 20, fontWeight: 700, letterSpacing: -0.5, color: C.wh } }, "📒 가계부"),
        e("div", { style: { display: "flex", alignItems: "center", gap: 6 } },
          // PWA Install Button (Shown if not in standalone mode)
          !isStandalone && e("button", {
            onClick: handleInstallClick,
            className: installPrompt ? "pulse-btn" : "",
            style: {
              background: installPrompt ? C.acc : C.card,
              color: installPrompt ? C.bg : C.acc,
              border: `1px solid ${installPrompt ? C.acc : C.bdr}`,
              borderRadius: 20, padding: "5px 10px", fontSize: 11, fontWeight: 700,
              cursor: "pointer", display: "flex", alignItems: "center", gap: 4
            }
          }, "📲 앱 설치"),

          // Cloud sync status indicator pill
          e("button", {
            onClick: () => setShowSyncModal(true),
            style: {
              background: C.card, border: `1px solid ${C.bdr}`, color: syncState.user ? C.inc : C.mut,
              borderRadius: 20, padding: "5px 10px", fontSize: 11, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 5
            }
          },
            e("span", { style: { width: 6, height: 6, borderRadius: "50%", background: syncState.user ? C.inc : "#fbbf24", display: "inline-block" } }),
            syncState.user ? "클라우드" : "로그인"
          ),
          // Category manager shortcut
          e("button", {
            onClick: () => setShowCatManager(true),
            style: { background: C.card, border: `1px solid ${C.bdr}`, color: C.mut, borderRadius: 20, width: 30, height: 30, fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }
          }, "⚙️")
        )
      ),

      // PWA Install Banner (Dismissible top banner if not installed)
      (!isStandalone && showInstallBanner) && e("div", {
        style: {
          background: `linear-gradient(90deg, ${C.card}, #2b2245)`,
          border: `1px solid ${C.acc}55`,
          borderRadius: 14, padding: "10px 14px", marginTop: 12,
          display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10
        }
      },
        e("div", { style: { display: "flex", alignItems: "center", gap: 10, flex: 1 } },
          e("span", { style: { fontSize: 22 } }, "📲"),
          e("div", null,
            e("div", { style: { fontSize: 12, fontWeight: 700, color: C.wh } }, "가계부를 홈 화면에 앱으로 설치하세요!"),
            e("div", { style: { fontSize: 11, color: C.mut } }, "브라우저 주소창 없이 진짜 앱으로 실행됩니다")
          )
        ),
        e("div", { style: { display: "flex", alignItems: "center", gap: 6 } },
          btn("설치", handleInstallClick, {
            background: C.acc, color: C.bg, border: "none", borderRadius: 8, padding: "5px 12px",
            fontSize: 12, fontWeight: 700, cursor: "pointer"
          }),
          btn("✕", () => setShowInstallBanner(false), {
            background: "transparent", border: "none", color: C.mut, fontSize: 14, cursor: "pointer", padding: "4px"
          })
        )
      ),

      // View switcher tabs
      e("div", { style: { display: "flex", gap: 8, marginTop: 12 } },
        ...[["calendar", "📅 캘린더"], ["analytics", "📊 분석"]].map(([v, label]) =>
          btn(label, () => setView(v), {
            flex: 1, padding: "8px 0", borderRadius: 12, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 700,
            background: view === v ? C.acc : C.card,
            color: view === v ? C.bg : C.mut,
            boxShadow: view === v ? "0 2px 8px rgba(167,139,250,0.25)" : "none",
            transition: "all 0.15s ease"
          })
        )
      )
    ),

    view === "calendar" ? calendarView : analyticsView,
    monthPickerEl,
    catManagerModal,
    syncModal,
    samsungGuideModal,
    iosGuideModal,
    modalEl
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>

<!-- Service Worker Registration: Immediate & Fail-safe -->
<script>
if ("serviceWorker" in navigator) {
  function registerServiceWorker() {
    navigator.serviceWorker.register("/sw.js", { scope: "/" })
      .then(function(reg) {
        console.log("[PWA] Service Worker registered with scope:", reg.scope);
      })
      .catch(function(err) {
        console.error("[PWA] Service Worker registration failed:", err);
      });
  }

  if (document.readyState === "complete" || document.readyState === "interactive") {
    registerServiceWorker();
  } else {
    window.addEventListener("load", registerServiceWorker);
  }
}
</script>
</body>
</html>
