<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>가계부</title>

  <!-- PWA -->
  <meta name="theme-color" content="#0f0e17"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="가계부"/>
  <link rel="manifest" href="manifest.json"/>

  <!-- Apple touch icons (inline SVG via data URI) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f0e17'/%3E%3Ctext y='.9em' font-size='72' x='12'%3E📒%3C/text%3E%3C/svg%3E"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet"/>

  <!-- React + Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <!-- Recharts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f0e17; }
    body { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
    #root { height: 100%; }
    input::placeholder { color: #7c7a9e; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
const {
  LineChart, Line, XAxis, YAxis, CartesianGrid,
  Tooltip, Legend, ResponsiveContainer
} = Recharts;

// ── Storage (localStorage) ──────────────────────────────────────────
const STORAGE_KEY = "gageboo-records-v1";
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch { return {}; }
}
function saveRecords(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

// ── Utilities ───────────────────────────────────────────────────────
const MONTHS_KR = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const DAYS_KR   = ["일","월","화","수","목","금","토"];
const fmt = n => n.toLocaleString("ko-KR") + "원";
const fmtShort = n => {
  const a = Math.abs(n);
  if (a >= 1e8) return (n/1e8).toFixed(1) + "억";
  if (a >= 1e4) return Math.round(n/1e4) + "만";
  return n.toLocaleString();
};
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function firstDay(y, m)    { return new Date(y, m, 1).getDay(); }

// ── Categories ──────────────────────────────────────────────────────
const EXPENSE_CATS = [
  {id:"food",      label:"식비",   icon:"🍚"},
  {id:"transport", label:"교통",   icon:"🚌"},
  {id:"shopping",  label:"쇼핑",   icon:"🛍️"},
  {id:"health",    label:"건강",   icon:"💊"},
  {id:"housing",   label:"주거",   icon:"🏠"},
  {id:"comm",      label:"통신",   icon:"📱"},
  {id:"culture",   label:"문화",   icon:"🎭"},
  {id:"etc",       label:"기타",   icon:"💡"},
];
const INCOME_CATS = [
  {id:"salary",    label:"급여",   icon:"💼"},
  {id:"bonus",     label:"보너스", icon:"🎁"},
  {id:"invest",    label:"투자",   icon:"📈"},
  {id:"side",      label:"부업",   icon:"🔧"},
  {id:"etc",       label:"기타",   icon:"💰"},
];

// ── Colors ──────────────────────────────────────────────────────────
const C = {
  bg:"#0f0e17", surface:"#1a1828", card:"#221f35", border:"#2e2a45",
  accent:"#a78bfa", income:"#34d399", expense:"#f87171",
  text:"#e2e0ef", muted:"#7c7a9e", white:"#ffffff",
};

// ═══════════════════════════════════════════════════════════════════
function App() {
  const today = new Date();
  const [view, setView]       = useState("calendar");
  const [year, setYear]       = useState(today.getFullYear());
  const [month, setMonth]     = useState(today.getMonth());
  const [records, setRecords] = useState(() => loadRecords());

  const [selDay, setSelDay]   = useState(null);
  const [showModal, setShowModal] = useState(false);
  const [showAdd, setShowAdd]     = useState(false);
  const [addType, setAddType]     = useState("expense");
  const [addAmt, setAddAmt]       = useState("");
  const [addCat, setAddCat]       = useState("");
  const [addMemo, setAddMemo]     = useState("");

  const monthKey     = `${year}-${String(month+1).padStart(2,"0")}`;
  const monthRecords = useMemo(() => records[monthKey] || {}, [records, monthKey]);

  const summary = useMemo(() => {
    let income = 0, expense = 0;
    Object.values(monthRecords).forEach(arr =>
      arr.forEach(r => r.type === "income" ? income += r.amount : expense += r.amount)
    );
    return { income, expense, balance: income - expense };
  }, [monthRecords]);

  const totalDays = daysInMonth(year, month);
  const startDay  = firstDay(year, month);
  const cells = [];
  for (let i = 0; i < startDay; i++) cells.push(null);
  for (let d = 1; d <= totalDays; d++) cells.push(d);

  function daySum(d) {
    const arr = monthRecords[String(d)] || [];
    let inc = 0, exp = 0;
    arr.forEach(r => r.type === "income" ? inc += r.amount : exp += r.amount);
    return { inc, exp };
  }

  function prevMonth() {
    if (month === 0) { setMonth(11); setYear(y => y - 1); }
    else setMonth(m => m - 1);
  }
  function nextMonth() {
    if (month === 11) { setMonth(0); setYear(y => y + 1); }
    else setMonth(m => m + 1);
  }

  function handleSave() {
    const amt = parseInt(addAmt.replace(/[^0-9]/g, ""), 10);
    if (!amt || amt <= 0) return;
    const cat = addCat || "etc";
    const rec = { type: addType, amount: amt, category: cat, memo: addMemo, ts: Date.now() };
    const key  = String(selDay);
    const updated = {
      ...records,
      [monthKey]: {
        ...monthRecords,
        [key]: [...(monthRecords[key] || []), rec],
      }
    };
    setRecords(updated);
    saveRecords(updated);
    setAddAmt(""); setAddMemo(""); setAddCat(""); setShowAdd(false);
  }

  function handleDelete(dayKey, idx) {
    const arr = [...(monthRecords[dayKey] || [])];
    arr.splice(idx, 1);
    const updated = { ...records, [monthKey]: { ...monthRecords, [dayKey]: arr } };
    setRecords(updated);
    saveRecords(updated);
  }

  function onAmountChange(e) {
    const raw = e.target.value.replace(/[^0-9]/g, "");
    setAddAmt(raw ? parseInt(raw, 10).toLocaleString() : "");
  }

  const analyticsData = useMemo(() => {
    const data = [];
    for (let i = 5; i >= 0; i--) {
      let m = month - i, y = year;
      if (m < 0) { m += 12; y -= 1; }
      const mk = `${y}-${String(m+1).padStart(2,"0")}`;
      const mr = records[mk] || {};
      let inc = 0, exp = 0;
      Object.values(mr).forEach(arr =>
        arr.forEach(r => r.type === "income" ? inc += r.amount : exp += r.amount)
      );
      data.push({ label: `${m+1}월`, income: inc, expense: exp, balance: inc - exp });
    }
    return data;
  }, [records, year, month]);

  const cats = addType === "expense" ? EXPENSE_CATS : INCOME_CATS;

  /* ── Render ── */
  return (
    <div style={{fontFamily:"'Noto Sans KR',sans-serif",background:C.bg,minHeight:"100dvh",color:C.text,maxWidth:480,margin:"0 auto",position:"relative"}}>

      {/* Header */}
      <div style={{padding:"env(safe-area-inset-top,20px) 20px 0",paddingTop:"max(env(safe-area-inset-top),20px)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",paddingTop:4}}>
          <span style={{fontSize:22,fontWeight:700,letterSpacing:-0.5,color:C.white}}>📒 가계부</span>
          <div style={{display:"flex",gap:8}}>
            {[["calendar","📅 캘린더"],["analytics","📊 분석"]].map(([v,label]) => (
              <button key={v} onClick={() => setView(v)} style={{
                padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",
                fontSize:13,fontWeight:600,transition:"all 0.2s",
                background:view===v ? C.accent : C.card,
                color:view===v ? C.bg : C.muted,
              }}>{label}</button>
            ))}
          </div>
        </div>

        {view === "calendar" && (
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:18}}>
            <button onClick={prevMonth} style={navBtn}>‹</button>
            <span style={{fontSize:18,fontWeight:700,color:C.white}}>{year}년 {MONTHS_KR[month]}</span>
            <button onClick={nextMonth} style={navBtn}>›</button>
          </div>
        )}
        {view === "analytics" && (
          <div style={{marginTop:18}}>
            <span style={{fontSize:18,fontWeight:700,color:C.white}}>최근 6개월 추이</span>
          </div>
        )}
      </div>

      {/* ══ CALENDAR ══ */}
      {view === "calendar" && (<>
        {/* Summary */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,padding:"16px 20px"}}>
          {[
            {label:"수입",value:summary.income,color:C.income},
            {label:"지출",value:summary.expense,color:C.expense},
            {label:"잔액",value:summary.balance,color:C.accent},
          ].map(s => (
            <div key={s.label} style={{background:C.card,borderRadius:14,padding:"12px 10px",textAlign:"center",border:`1px solid ${C.border}`}}>
              <div style={{fontSize:11,color:C.muted,marginBottom:4}}>{s.label}</div>
              <div style={{fontSize:13,fontWeight:700,color:s.color}}>{fmtShort(s.value)}</div>
            </div>
          ))}
        </div>

        {/* Weekday headers */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",padding:"0 14px",marginBottom:6}}>
          {DAYS_KR.map((d,i) => (
            <div key={d} style={{textAlign:"center",fontSize:11,fontWeight:600,paddingBottom:4,
              color:i===0?"#f87171":i===6?"#60a5fa":C.muted}}>{d}</div>
          ))}
        </div>

        {/* Grid */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,padding:"0 14px 120px"}}>
          {cells.map((d,i) => {
            if (!d) return <div key={`e${i}`}/>;
            const {inc,exp} = daySum(d);
            const isToday = d===today.getDate() && month===today.getMonth() && year===today.getFullYear();
            const dow = (startDay + d - 1) % 7;
            return (
              <div key={d} onClick={() => { setSelDay(d); setShowModal(true); setShowAdd(false); }}
                style={{
                  background:isToday ? C.accent+"22" : C.card,
                  border:isToday ? `1.5px solid ${C.accent}` : `1px solid ${C.border}`,
                  borderRadius:12,padding:"8px 4px 6px",cursor:"pointer",
                  minHeight:68,display:"flex",flexDirection:"column",alignItems:"center",
                  transition:"background 0.15s",
                }}>
                <span style={{fontSize:13,fontWeight:700,color:dow===0?"#f87171":dow===6?"#60a5fa":C.text}}>{d}</span>
                {inc>0 && <span style={{fontSize:9,color:C.income,marginTop:2,fontWeight:600}}>+{fmtShort(inc)}</span>}
                {exp>0 && <span style={{fontSize:9,color:C.expense,marginTop:1,fontWeight:600}}>-{fmtShort(exp)}</span>}
              </div>
            );
          })}
        </div>
      </>)}

      {/* ══ ANALYTICS ══ */}
      {view === "analytics" && (
        <div style={{padding:"16px 16px 120px"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:20}}>
            {[
              {label:"이번달 수입",value:summary.income,color:C.income},
              {label:"이번달 지출",value:summary.expense,color:C.expense},
              {label:"이번달 잔액",value:summary.balance,color:C.accent},
            ].map(s => (
              <div key={s.label} style={{background:C.card,borderRadius:14,padding:"12px 10px",textAlign:"center",border:`1px solid ${C.border}`}}>
                <div style={{fontSize:10,color:C.muted,marginBottom:4}}>{s.label}</div>
                <div style={{fontSize:13,fontWeight:700,color:s.color}}>{fmtShort(s.value)}</div>
              </div>
            ))}
          </div>

          <div style={{background:C.card,borderRadius:16,padding:"16px 8px",border:`1px solid ${C.border}`,marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:700,color:C.white,paddingLeft:12,marginBottom:12}}>수입 / 지출 추이</div>
            <ResponsiveContainer width="100%" height={200}>
              <LineChart data={analyticsData} margin={{top:5,right:16,left:0,bottom:5}}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border}/>
                <XAxis dataKey="label" tick={{fill:C.muted,fontSize:11}} axisLine={false} tickLine={false}/>
                <YAxis tickFormatter={fmtShort} tick={{fill:C.muted,fontSize:10}} axisLine={false} tickLine={false} width={46}/>
                <Tooltip
                  contentStyle={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,fontSize:12}}
                  labelStyle={{color:C.white,fontWeight:700}}
                  formatter={(v,n) => [fmt(v), n==="income"?"수입":"지출"]}
                />
                <Legend formatter={v => v==="income"?"수입":"지출"} wrapperStyle={{fontSize:12,color:C.muted}}/>
                <Line type="monotone" dataKey="income" stroke={C.income} strokeWidth={2} dot={{r:4,fill:C.income}} name="income"/>
                <Line type="monotone" dataKey="expense" stroke={C.expense} strokeWidth={2} dot={{r:4,fill:C.expense}} name="expense"/>
              </LineChart>
            </ResponsiveContainer>
          </div>

          <div style={{background:C.card,borderRadius:16,padding:"16px 8px",border:`1px solid ${C.border}`}}>
            <div style={{fontSize:13,fontWeight:700,color:C.white,paddingLeft:12,marginBottom:12}}>잔액 추이</div>
            <ResponsiveContainer width="100%" height={200}>
              <LineChart data={analyticsData} margin={{top:5,right:16,left:0,bottom:5}}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border}/>
                <XAxis dataKey="label" tick={{fill:C.muted,fontSize:11}} axisLine={false} tickLine={false}/>
                <YAxis tickFormatter={fmtShort} tick={{fill:C.muted,fontSize:10}} axisLine={false} tickLine={false} width={46}/>
                <Tooltip
                  contentStyle={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,fontSize:12}}
                  labelStyle={{color:C.white,fontWeight:700}}
                  formatter={v => [fmt(v),"잔액"]}
                />
                <Line type="monotone" dataKey="balance" stroke={C.accent} strokeWidth={2.5}
                  dot={({cx,cy,value}) => <circle key={`${cx}-${cy}`} cx={cx} cy={cy} r={4} fill={value<0?C.expense:C.accent} stroke="none"/>}
                />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
      )}

      {/* ══ DAY MODAL ══ */}
      {showModal && selDay && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:100}}
          onClick={e => { if(e.target===e.currentTarget){ setShowModal(false); setShowAdd(false); }}}>
          <div style={{background:C.surface,width:"100%",maxWidth:480,borderRadius:"24px 24px 0 0",
            padding:`0 0 max(env(safe-area-inset-bottom),24px)`,maxHeight:"80vh",overflowY:"auto",
            border:`1px solid ${C.border}`,borderBottom:"none"}}>

            <div style={{display:"flex",justifyContent:"center",padding:"12px 0 4px"}}>
              <div style={{width:40,height:4,borderRadius:2,background:C.border}}/>
            </div>

            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 20px 14px"}}>
              <span style={{fontSize:17,fontWeight:700,color:C.white}}>{year}년 {month+1}월 {selDay}일</span>
              <button onClick={() => { setShowAdd(true); setAddType("expense"); setAddCat(""); setAddAmt(""); setAddMemo(""); }}
                style={{background:C.accent,color:C.bg,border:"none",borderRadius:20,padding:"7px 16px",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                + 추가
              </button>
            </div>

            {(monthRecords[String(selDay)]||[]).length === 0 && !showAdd && (
              <div style={{textAlign:"center",padding:"24px 0",color:C.muted,fontSize:13}}>기록이 없습니다</div>
            )}

            <div style={{padding:"0 16px"}}>
              {(monthRecords[String(selDay)]||[]).map((r,idx) => {
                const catList = r.type==="income" ? INCOME_CATS : EXPENSE_CATS;
                const cat = catList.find(c => c.id===r.category) || catList[catList.length-1];
                return (
                  <div key={idx} style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                    background:C.card,borderRadius:12,padding:"12px 14px",marginBottom:8,border:`1px solid ${C.border}`}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <span style={{fontSize:20}}>{cat.icon}</span>
                      <div>
                        <div style={{fontSize:12,color:C.muted}}>{cat.label}</div>
                        {r.memo && <div style={{fontSize:11,color:C.muted,marginTop:1}}>{r.memo}</div>}
                      </div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <span style={{fontSize:14,fontWeight:700,color:r.type==="income"?C.income:C.expense}}>
                        {r.type==="income"?"+":"-"}{fmt(r.amount)}
                      </span>
                      <button onClick={() => handleDelete(String(selDay),idx)}
                        style={{background:"transparent",border:"none",color:C.muted,cursor:"pointer",fontSize:18,lineHeight:1}}>×</button>
                    </div>
                  </div>
                );
              })}
            </div>

            {showAdd && (
              <div style={{padding:"12px 16px 0"}}>
                <div style={{background:C.card,borderRadius:16,padding:16,border:`1px solid ${C.border}`}}>
                  <div style={{display:"flex",gap:8,marginBottom:14}}>
                    {[{v:"expense",label:"지출",color:C.expense},{v:"income",label:"수입",color:C.income}].map(t => (
                      <button key={t.v} onClick={() => { setAddType(t.v); setAddCat(""); }}
                        style={{flex:1,padding:"9px 0",borderRadius:10,border:"none",cursor:"pointer",fontWeight:700,fontSize:14,transition:"all 0.15s",
                          background:addType===t.v?t.color+"22":C.surface,
                          color:addType===t.v?t.color:C.muted,
                          outline:addType===t.v?`1.5px solid ${t.color}`:"1.5px solid transparent"}}>
                        {t.label}
                      </button>
                    ))}
                  </div>

                  <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
                    {cats.map(c => (
                      <button key={c.id} onClick={() => setAddCat(c.id)}
                        style={{padding:"5px 10px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,transition:"all 0.15s",
                          background:addCat===c.id?C.accent+"33":C.surface,
                          color:addCat===c.id?C.accent:C.muted,
                          outline:addCat===c.id?`1.5px solid ${C.accent}`:"1.5px solid transparent"}}>
                        {c.icon} {c.label}
                      </button>
                    ))}
                  </div>

                  <input type="text" inputMode="numeric" placeholder="금액 입력"
                    value={addAmt} onChange={onAmountChange}
                    style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,
                      padding:"10px 14px",color:C.white,fontSize:16,fontWeight:700,outline:"none",marginBottom:10}}/>

                  <input type="text" placeholder="메모 (선택)"
                    value={addMemo} onChange={e => setAddMemo(e.target.value)}
                    style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,
                      padding:"9px 14px",color:C.text,fontSize:13,outline:"none",marginBottom:12}}/>

                  <div style={{display:"flex",gap:8}}>
                    <button onClick={() => setShowAdd(false)}
                      style={{flex:1,padding:"10px 0",borderRadius:10,border:`1px solid ${C.border}`,
                        background:"transparent",color:C.muted,fontWeight:600,cursor:"pointer",fontSize:13}}>취소</button>
                    <button onClick={handleSave}
                      style={{flex:2,padding:"10px 0",borderRadius:10,border:"none",
                        background:C.accent,color:C.bg,fontWeight:700,cursor:"pointer",fontSize:14}}>저장</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const navBtn = {
  background:"transparent",border:`1px solid #2e2a45`,color:"#e2e0ef",
  borderRadius:10,width:36,height:36,display:"inline-flex",alignItems:"center",
  justifyContent:"center",cursor:"pointer",fontSize:20,fontWeight:300,
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<!-- Service Worker 등록 -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
